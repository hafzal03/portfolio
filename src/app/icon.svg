<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Obsidian chip, gold monogram. Built to survive 16px: one heavy letterform,
       no gradients inside the glyph, and nothing thinner than 2px. -->
  <defs>
    <linearGradient id="chip" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14141b"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="gold" x1="9" y1="7" x2="23" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7d79a"/>
      <stop offset="0.55" stop-color="#e8b65a"/>
      <stop offset="1" stop-color="#c9953f"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#chip)"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4" fill="none"
        stroke="#e8b65a" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- H -->
  <path d="M9 8h3.6v6.4h6.8V8H23v16h-3.6v-6.6h-6.8V24H9V8z" fill="url(#gold)"/>
</svg>
