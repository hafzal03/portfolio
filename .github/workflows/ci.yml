name: Quality Gate

# Runs lint/typecheck/test/build on every push and PR against master.
# Deployment itself is handled separately by
# .github/workflows/azure-static-web-apps-gentle-coast-01d41c510.yml
# (auto-generated by the Azure Static Web Apps GitHub integration) — this
# workflow does not deploy anything, it only verifies the app is sound.
#
# An alternative Azure App Service + OIDC deploy path is documented in
# docs/DEPLOYMENT.md for anyone who wants more control than Static Web Apps
# gives; it isn't wired up here since Static Web Apps is what's actually in use.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # A placeholder key is enough to satisfy the build — no network
          # calls happen at build time, only at request time.
          OPENAI_API_KEY: "build-placeholder"
