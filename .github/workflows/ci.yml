name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for Azure OIDC login in the deploy job

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # A placeholder key is enough to satisfy the build — no network
          # calls happen at build time, only at request time.
          OPENAI_API_KEY: "build-placeholder"

      - name: Upload standalone build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

  deploy:
    name: Deploy to Azure
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: deploy

      - name: Assemble deployable app
        # Next.js standalone output deliberately excludes static assets —
        # they have to be copied in manually alongside server.js.
        run: |
          mkdir -p deploy/.next/standalone/.next/static
          cp -r deploy/.next/static/. deploy/.next/standalone/.next/static/
          mkdir -p deploy/.next/standalone/public
          if [ -d deploy/public ]; then cp -r deploy/public/. deploy/.next/standalone/public/; fi

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: deploy/.next/standalone
